<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Tic Tac Toe</h1>
    <div class="modes">
      <button id="mode-ai" class="mode active">Kompyuterga qarshi</button>
      <button id="mode-pvp" class="mode">2 o'yinchi</button>
    </div>
    <div id="levels" class="modes">
      <button class="level" data-level="easy">Oson</button>
      <button class="level" data-level="medium">O'rta</button>
      <button class="level active" data-level="hard">Qiyin</button>
    </div>
    <div class="scoreboard">
      <div class="score x"><span id="label-x">Siz (X)</span><strong id="score-x">0</strong></div>
      <div class="score draw"><span>Durang</span><strong id="score-draw">0</strong></div>
      <div class="score o"><span id="label-o">Kompyuter (O)</span><strong id="score-o">0</strong></div>
    </div>
    <p id="status" class="status">Navbat: X</p>

    <div id="board" class="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <div class="actions">
      <button id="restart" class="restart">Yangi o'yin</button>
      <button id="reset-score" class="restart secondary">Hisobni nolga tushirish</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
